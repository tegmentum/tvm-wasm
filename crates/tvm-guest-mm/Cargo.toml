[package]
name = "tvm-guest-mm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Guest-side TVM with multi-memory pools. Self-contained WAT — no host imports needed. Scales beyond 4 GiB by composing internal wasm memories."

[dependencies]
tvm-core = { path = "../tvm-core", default-features = false }
# hashbrown gives us a HashMap that compiles in both std and no_std modes.
# Required since `HandleRemap::mapping` (in tvm-core) is
# `hashbrown::HashMap` per U2 of PLAN-tvm-convergence.md.
hashbrown = { workspace = true }
# wat is host-only (template generation); gated behind the std
# feature so no_std guest consumers don't pull it in.
wat = { workspace = true, optional = true }

[features]
default = ["std"]
# Pulls in libstd. Required for host-only modules:
#   - module (uses String formatting + the `wat` parser for WAT
#     template generation)
#   - wasi_spill (WAT helper emission)
# With std off, only the guest-side directory + pool surface is
# available: GuestDirectory, Pool, and the dispatch helpers.
std = ["tvm-core/std", "dep:wat"]

[dev-dependencies]
wasmtime = { workspace = true }
anyhow = { workspace = true }
tvm-test-harness = { path = "../tvm-test-harness" }
tvm-wasmtime = { path = "../tvm-wasmtime" }

[[bin]]
name = "gen_guest_wasm"
required-features = ["std"]

[[bench]]
name = "guest_mm_dispatch"
harness = false

[[bench]]
name = "full_matrix"
harness = false
