[package]
name = "tvm-wasmtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tvm-core = { path = "../tvm-core" }
wasmtime = { workspace = true }
anyhow = { workspace = true }

# ADR-0029 Phase 6.9.a — the wasmos-runtime-api migration path.
# Git dep so external consumers (sqlink-host, girder-wasmtime, …)
# can pull tvm-wasmtime from git without needing the sibling
# wasmos checkout at ../../../wasmos. The workspace-level
# `[patch."https://github.com/tegmentum/wasmos.git"]` block below
# redirects to the local sibling checkout when this crate is
# built from within tvm-wasm's own workspace, so local dev keeps
# the "edit and cargo build" loop.
#
# When wasmos publishes to crates.io the git = "…" becomes
# version = "0.1" and the workspace patch can retire.
wasmos-runtime-api = { git = "https://github.com/tegmentum/wasmos.git", tag = "v0.1.0" }
async-trait = "0.1"

[dev-dependencies]
anyhow = { workspace = true }
wat = { workspace = true }
wit-component = { workspace = true }
tempfile = "3"
criterion = "0.5"
tvm-test-harness = { path = "../tvm-test-harness" }

# Phase 6.9.a — v48 wasmos adapter is our reference back-end for
# raw_linker_wasmos integration tests. Same git-dep + workspace-
# patch pattern as wasmos-runtime-api above.
wasmos-runtime-wasmtime-v48 = { git = "https://github.com/tegmentum/wasmos.git", tag = "v0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "host_paths"
harness = false

[[bench]]
name = "reducer_imports"
harness = false

# ADR-0029 Phase 6.9.b — wasmos-overhead comparison bench.
[[bench]]
name = "wasmos_overhead"
harness = false
