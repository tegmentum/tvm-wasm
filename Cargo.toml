[workspace]
resolver = "2"
members = [
    "crates/tvm-core",
    "crates/tvm-wasmtime",
    "crates/tvm-tests",
    "crates/tvm-guest-rt",
    "crates/tvm-guest-mm",
    "crates/tvm-guest-mm-rt",
    "crates/tvm-guest-mm-link",
    "crates/tvm-test-harness",
    "bench-framework/runner",
    "bench-framework/runner-wasmer",
]
exclude = [
    # Built separately for the wasm32-unknown-unknown target via cargo from the
    # end-to-end tests. Excluded from the host workspace so a default
    # `cargo build` doesn't try to compile them for the host triple.
    "examples/guest-demo",
    "examples/guest-fast-path",
    "examples/multimem-probe",
    "examples/rust-cdylib-consumer",
    "examples/rust-cdylib-consumer-with-imports",
    "examples/rust-cdylib-consumer-indirect",
    "bench-framework/workloads/m32",
    "bench-framework/workloads/m64",
    "bench-framework/workloads/tvm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tegmentum/tvm-wasm"

[workspace.dependencies]
# thiserror 2.0+ with default-features=false → no_std-compatible
# derive (uses core::error::Error stabilized in Rust 1.81). Crates
# opt into std features as they need them.
thiserror = { version = "2.0", default-features = false }
hashbrown = "0.15"
wasmtime = { version = "48.0.1", features = ["component-model", "cranelift", "runtime"] }
wat = "1"
wit-component = "0.240"
anyhow = "1.0"

# ADR-0029 D2 Session 15a (2026-09-01): wasmos deps in
# `crates/tvm-wasmtime/Cargo.toml` are declared as git+rev so
# external consumers (sqlink-host, girder-wasmtime, …) can pull
# tvm-wasmtime from git without needing the sibling wasmos
# checkout. When this crate is built from within tvm-wasm's own
# workspace, this patch redirects the git dep to the sibling
# checkout at ../wasmos so local dev keeps the "edit and cargo
# build" loop; without a wasmos sibling checkout, the git rev is
# used verbatim.
#
# When wasmos publishes to crates.io, both this patch and the
# git = "…" specs in tvm-wasmtime's Cargo.toml retire in favor
# of `version = "0.1"`.
[patch."https://github.com/tegmentum/wasmos.git"]
wasmos-runtime-api = { path = "../wasmos/runtime/api" }
wasmos-runtime-wasmtime-v48 = { path = "../wasmos/runtime/wasmtime/v48" }
